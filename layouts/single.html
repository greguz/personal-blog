{{ define "main" }}
{{ partial "back_link.html" .}}

<article>
  {{ if .Date }}
    <p class="post-meta">
      <time datetime="{{ .Date }}">
        {{ .Date | time.Format site.Params.theme_config.date_format }}
      </time>
    </p>
  {{ end }}

  <h1>{{ .Title }}</h1>

  {{ .Content }}
</article>
{{ end }}
